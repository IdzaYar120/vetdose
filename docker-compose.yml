services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vetdose
      POSTGRES_PASSWORD: vetdose
      POSTGRES_DB: vetdose
    volumes:
      - vetdose_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetdose -d vetdose"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://vetdose:vetdose@db:5432/vetdose
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173", "http://localhost:8080"]}
      ENVIRONMENT: development
    ports:
      - "8000:8000"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  vetdose_pg_data:
