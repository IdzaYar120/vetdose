server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker and manifest must always be revalidated so an
    # installed PWA actually picks up a new deploy — vite-plugin-pwa's
    # "autoUpdate" registration relies on the browser re-fetching sw.js.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite fingerprints these filenames with a content hash, so they can be
    # cached indefinitely — a new build always gets new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routing (react-router): let unmatched paths fall through
    # to index.html rather than 404ing on a real page like /result/....
    location / {
        try_files $uri /index.html;
    }
}
